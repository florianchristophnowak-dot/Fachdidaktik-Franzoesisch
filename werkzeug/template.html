<title>Enzyklopädie Fachdidaktik Französisch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/* Layout: eine Heftseite mit grands carreaux. Die Rubrik steht am Rand links der roten Randlinie, der Text rechts davon.
   Jeder Bereich A bis H trägt die Farbe eines Heftumschlags; daraus entstehen Kürzel, Netz und Systematik. */
:root{
  --paper:#fbfcfe; --paper-2:#f3f6fb; --paper-3:#e8edf7;
  --ink:#1b2232; --ink-2:#434d63; --ink-3:#6b7489;
  --line:#dae0ec; --seyes:#dfe5f4; --seyes-2:#c4cfec;
  --marge:#dc4d63; --encre:#2246a3; --encre-bg:#e5ebfa; --mark:#ffe97f;
  --shadow:0 12px 32px rgba(27,34,50,.14), 0 2px 6px rgba(27,34,50,.08);
  --c-a:#2c60bf; --c-a-bg:#e4ecfa;
  --c-b:#c4362f; --c-b-bg:#fbe7e5;
  --c-c:#20834c; --c-c-bg:#e2f2e8;
  --c-d:#7643b3; --c-d-bg:#efe7f8;
  --c-e:#b95d0b; --c-e-bg:#fbebdd;
  --c-f:#8c6f00; --c-f-bg:#f5efd2;
  --c-g:#0d7d8a; --c-g-bg:#dcf1f3;
  --c-h:#ab3878; --c-h-bg:#f8e3ee;
  --f-display:'Spectral','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --f-text:'Spectral','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --f-label:'Spectral SC','Spectral',Georgia,serif;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --header-h:60px; --reg-h:46px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151e; --paper-2:#171c27; --paper-3:#1f2533;
    --ink:#e5e8f0; --ink-2:#b4bbcb; --ink-3:#8b93a6;
    --line:#2a3141; --seyes:#1c2230; --seyes-2:#283149;
    --marge:#f0717f; --encre:#93b0ff; --encre-bg:#1e2a49; --mark:#6b5a12;
    --shadow:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
    --c-a:#86aaf5; --c-a-bg:#1b2a48;
    --c-b:#f28c83; --c-b-bg:#3b2020;
    --c-c:#6fcf97; --c-c-bg:#163224;
    --c-d:#be9af2; --c-d-bg:#2c2242;
    --c-e:#f1a862; --c-e-bg:#392616;
    --c-f:#ddc261; --c-f-bg:#342e18;
    --c-g:#62cbd6; --c-g-bg:#133339;
    --c-h:#ef90c4; --c-h-bg:#3a1f30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151e; --paper-2:#171c27; --paper-3:#1f2533;
  --ink:#e5e8f0; --ink-2:#b4bbcb; --ink-3:#8b93a6;
  --line:#2a3141; --seyes:#1c2230; --seyes-2:#283149;
  --marge:#f0717f; --encre:#93b0ff; --encre-bg:#1e2a49; --mark:#6b5a12;
  --shadow:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --c-a:#86aaf5; --c-a-bg:#1b2a48;
  --c-b:#f28c83; --c-b-bg:#3b2020;
  --c-c:#6fcf97; --c-c-bg:#163224;
  --c-d:#be9af2; --c-d-bg:#2c2242;
  --c-e:#f1a862; --c-e-bg:#392616;
  --c-f:#ddc261; --c-f-bg:#342e18;
  --c-g:#62cbd6; --c-g-bg:#133339;
  --c-h:#ef90c4; --c-h-bg:#3a1f30;
  color-scheme:dark;
}
.a-a,[data-ref^="A"]{--c:var(--c-a);--c-bg:var(--c-a-bg)}
.a-b,[data-ref^="B"]{--c:var(--c-b);--c-bg:var(--c-b-bg)}
.a-c,[data-ref^="C"]{--c:var(--c-c);--c-bg:var(--c-c-bg)}
.a-d,[data-ref^="D"]{--c:var(--c-d);--c-bg:var(--c-d-bg)}
.a-e,[data-ref^="E"]{--c:var(--c-e);--c-bg:var(--c-e-bg)}
.a-f,[data-ref^="F"]{--c:var(--c-f);--c-bg:var(--c-f-bg)}
.a-g,[data-ref^="G"]{--c:var(--c-g);--c-bg:var(--c-g-bg)}
.a-h,[data-ref^="H"]{--c:var(--c-h);--c-bg:var(--c-h-bg)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-kerning:normal}
a{color:var(--encre)}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}

.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:9px}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.1;margin-right:6px}
.brand small{font:500 .78rem/1.1 var(--f-label);letter-spacing:.06em;color:var(--ink-3)}
.brand span{font:600 1.16rem/1.15 var(--f-display);letter-spacing:-.005em}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:.92rem;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:7px}
.nav a:hover{color:var(--ink);background:var(--paper-2)}
.nav a[aria-current="page"]{color:var(--encre);background:var(--encre-bg);font-weight:500}
.search{position:relative;margin-left:auto;flex:0 1 22rem;min-width:0}
.search input{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper-2);border:1px solid var(--line);
  border-radius:9px;padding:8px 34px 8px 34px;outline:none}
.search input:focus{border-color:var(--encre);background:var(--paper)}
.search .ico{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 .75rem var(--f-ui);color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--paper)}
.results{position:absolute;right:0;top:calc(100% + 6px);width:min(36rem,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60}
.res{display:block;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none}
.res[aria-selected="true"],.res:hover{background:var(--encre-bg)}
.res .where{display:flex;gap:8px;align-items:baseline;font-size:.82rem;color:var(--ink-3)}
.res .where b{color:var(--ink);font-weight:600;font-size:.9rem}
.res .snip{font-family:var(--f-text);font-size:.94rem;color:var(--ink-2);margin-top:2px;line-height:1.45}
.res-empty{padding:12px;color:var(--ink-3);font-size:.92rem}
.res-more{padding:6px 10px 8px;color:var(--ink-3);font-size:.82rem}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
@media (max-width:760px){
  .top{position:static}
  .search{flex:1 1 100%;order:3}
  .search kbd{display:none}
  .results{left:0;right:auto;width:100%}
}

/* ---------- gemeinsame Bausteine ---------- */
main{min-height:60vh}
.code{display:inline-block;font:600 .8rem/1.5 var(--f-ui);letter-spacing:.02em;font-variant-numeric:tabular-nums;
  color:var(--c,var(--ink-2));background:var(--c-bg,var(--paper-3));border-radius:5px;padding:0 6px;min-width:2.3em;text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .82rem/1.2 var(--f-ui);color:var(--ink-2);text-decoration:none;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--paper)}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--ink-2)}
.st.dr{background:var(--ink-2)}
.eyebrow{font:500 .9rem/1.3 var(--f-label);letter-spacing:.05em;color:var(--ink-3)}
.lead{font-family:var(--f-text);font-size:1.15rem;line-height:1.55;color:var(--ink-2);max-width:44rem;margin:0}
.section-title{font:600 1.45rem/1.2 var(--f-display);margin:0}
.muted{color:var(--ink-3)}
a.ref{font:600 .82em/1.4 var(--f-ui);letter-spacing:.02em;padding:0 .38em;border-radius:4px;background:var(--c-bg);color:var(--c);
  text-decoration:none;white-space:nowrap}
a.ref:hover{outline:1.5px solid var(--c);outline-offset:0}
.ref-missing{font:600 .82em var(--f-ui);color:var(--ink-3);border:1px dashed var(--line);border-radius:4px;padding:0 .3em}

/* ---------- Startseite ---------- */
.hero{position:relative;margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,transparent calc(4.5rem - 1px),var(--marge) calc(4.5rem - 1px),var(--marge) calc(4.5rem + 1px),transparent calc(4.5rem + 1px)),
    repeating-linear-gradient(to right,transparent 0 31px,var(--seyes) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes-2) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 7px,var(--seyes) 7px 8px)}
.hero-inner{padding:30px 28px 30px calc(4.5rem + 24px);display:grid;gap:12px}
.hero h1{font:600 clamp(2rem,1.25rem + 2.3vw,3rem)/1.08 var(--f-display);letter-spacing:-.012em;margin:0}
.hero .lead{color:var(--ink-2)}
@media (max-width:620px){.hero-inner{padding:22px 16px 22px calc(2.2rem + 16px)}
  .hero{background-image:
    linear-gradient(to right,transparent calc(2.2rem - 1px),var(--marge) calc(2.2rem - 1px),var(--marge) calc(2.2rem + 1px),transparent calc(2.2rem + 1px)),
    repeating-linear-gradient(to right,transparent 0 31px,var(--seyes) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--seyes-2) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 7px,var(--seyes) 7px 8px)}}

.ways{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:1060px){.ways{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ways{grid-template-columns:minmax(0,1fr)}}
.way{display:grid;gap:4px;align-content:start;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;background:var(--paper)}
.way:hover{border-color:var(--encre);background:var(--encre-bg)}
.way .k{font-size:.76rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.way .t{font:600 1.12rem/1.25 var(--f-display);color:var(--ink)}
.way .d{font-size:.88rem;color:var(--ink-2)}

.sys-head{display:flex;align-items:end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-top:40px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.filters{display:grid;gap:8px;margin-top:16px}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fgroup .gl{font-size:.8rem;color:var(--ink-3);min-width:9.5rem}
@media (max-width:620px){.fgroup .gl{min-width:100%}}
.fstate{font-size:.88rem;color:var(--ink-2);min-height:1.4em;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fstate button{background:none;border:0;padding:0;color:var(--encre);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:.88rem}

.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(16.5rem,1fr));gap:26px 28px;margin-top:22px;align-items:start}
.area{min-width:0;scroll-margin-top:calc(var(--header-h) + 16px)}
.area-h{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--c)}
.area-h .L{font:600 2rem/1 var(--f-display);color:var(--c)}
.area-h .N{font:600 1.02rem/1.2 var(--f-display);color:var(--ink)}
.area ul{list-style:none;margin:0;padding:0}
.area li a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 2px;
  border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);transition:opacity .15s}
.area li a:hover .tt{color:var(--encre);text-decoration:underline;text-underline-offset:2px}
.area li a .tt{font-family:var(--f-text);font-size:1.02rem;line-height:1.3}
.area li a.dim{opacity:.28}
.area li a.hit .tt{font-weight:600}

/* ---------- Eintrag ---------- */
.entry{display:grid;grid-template-columns:minmax(0,1fr) 19rem;column-gap:44px;align-items:start}
.e-head{grid-column:1/-1;padding-top:26px;display:grid;gap:10px}
.e-head .eyebrow a{color:inherit;text-decoration:none}
.e-head .eyebrow a:hover{color:var(--ink)}
.e-head .eyebrow .sq{display:inline-block;width:.62em;height:.62em;border-radius:2px;background:var(--c);margin-right:.5em;vertical-align:.05em}
.e-head h1{margin:0;font:600 clamp(1.9rem,1.35rem + 2vw,2.75rem)/1.1 var(--f-display);letter-spacing:-.01em;display:flex;gap:.4em;align-items:baseline;flex-wrap:wrap}
.e-head h1 .ec{font:600 .62em/1 var(--f-ui);letter-spacing:.01em;color:var(--c);background:var(--c-bg);border-radius:8px;padding:.18em .4em;position:relative;top:-.12em}
.e-meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:.86rem;color:var(--ink-3)}
.e-meta .tags{display:flex;gap:6px;flex-wrap:wrap}
.e-meta .stand{display:inline-flex;gap:7px;align-items:center}
.e-meta .e-links{display:inline-flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.e-meta .doc{color:var(--encre);text-decoration:none;font-weight:500}
.e-meta .doc:hover{text-decoration:underline}
.summary{font-family:var(--f-text);font-size:1.18rem;line-height:1.55;color:var(--ink-2);max-width:46rem;margin:4px 0 0}

.reg{grid-column:1/-1;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h));z-index:15;background:var(--paper);
  border-bottom:1px solid var(--line);margin-top:16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:7px}
.reg::-webkit-scrollbar{display:none}
.reg a{flex:none;font-size:.85rem;color:var(--ink-2);text-decoration:none;padding:5px 9px;border-radius:6px;white-space:nowrap}
.reg a:hover{background:var(--paper-2);color:var(--ink)}
.reg a.on{color:var(--encre);background:var(--encre-bg);font-weight:500}

.e-body{min-width:0;grid-column:1}
.sec{--lab:9.2rem;display:grid;grid-template-columns:var(--lab) minmax(0,1fr);column-gap:30px;padding-block:24px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--marge),var(--marge)) no-repeat calc(var(--lab) + 14px) 0/1.5px 100%;
  scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--header-h) + var(--reg-h) + 8px)}
.sec>h2{grid-column:1;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;margin:0;font:500 1.04rem/1.3 var(--f-label);letter-spacing:.035em;color:var(--ink-2);text-align:right;padding-top:.18rem;text-wrap:balance}
.sec>.body{grid-column:2;min-width:0}
@media (max-width:760px){
  .sec{grid-template-columns:minmax(0,1fr);background-position:0 0;padding-left:16px}
  .sec>h2{text-align:left;margin-bottom:8px}
  .sec>.body{grid-column:1}
}
.body{font-family:var(--f-text);font-size:1.08rem;line-height:1.62;max-width:46rem}
.body p{margin:0 0 .8em}
.body ul,.body ol{margin:0 0 .9em;padding-left:1.3em}
.body li{margin:0 0 .38em;padding-left:.15em}
.body li::marker{color:var(--ink-3)}
.body ol li::marker{font-family:var(--f-ui);font-weight:600;font-size:.85em}
.body strong{font-weight:600}
.body h4.sub{font:600 .76rem/1.3 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:1.3em 0 .5em}
.body h4.sub:first-child{margin-top:.2em}
.body p.note{font-size:.93rem;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:.7em;margin-top:1.1em}
.body a.ext{text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto;margin:.3em 0 1.1em}
.body table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.9rem;line-height:1.45}
.body th{text-align:left;font-weight:600;color:var(--ink);border-bottom:1.5px solid var(--ink-3);padding:7px 10px 7px 0;vertical-align:bottom}
.body td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;vertical-align:top}
.sec-stolpersteine td:first-child{font-weight:600;color:var(--ink);width:36%}
.sec-praxis p.lead-bold>strong:first-child,.sec-haltung p.lead-bold>strong:first-child{display:block;font:600 .98rem/1.35 var(--f-ui);margin-bottom:3px}
.sec-praxis p.lead-bold{padding-left:14px;border-left:3px solid var(--c-bg);margin-bottom:1.1em}
.sec-beobachten .body li:last-child{font-style:italic}
.sec-bibliografie .body{font-size:.98rem;line-height:1.55}
.sec-bibliografie .body li{padding-left:.15em;text-indent:0}
.qv-list{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:8px}
.qv-list li{margin:0!important;padding:0!important}
.qv-list a.qv{display:inline-flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 6px;
  font:500 .9rem/1.3 var(--f-ui);color:var(--ink);white-space:normal}
.qv-list a.qv:hover{border-color:var(--c);outline:none}

.aside{grid-column:2;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h) + var(--reg-h) + 18px);
  max-height:calc(100vh - var(--header-h) - var(--reg-h) - 40px);overflow:auto;padding:22px 2px 20px;display:grid;gap:22px;scrollbar-width:thin}
.aside h3{font:600 .76rem/1.3 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.aside .box{min-width:0}
.mini-wrap{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);padding:6px}
.mini{width:100%;height:auto;display:block}
.mini-key{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.76rem;line-height:1.3;color:var(--ink-3);padding:0 6px 6px}
.mini-key i{display:inline-block;width:18px;height:0;border-top:1.5px solid var(--ink-3);vertical-align:middle;margin-right:5px}
.mini-key i.d{border-top-style:dashed}
.linklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.linklist a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:baseline;padding:5px 6px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.9rem;line-height:1.3}
.linklist a:hover{background:var(--paper-2)}
.linklist a.cur{background:var(--paper-3)}
.linklist .why{grid-column:2;font-size:.76rem;color:var(--ink-3)}
@media (max-width:1099px){
  .entry{grid-template-columns:minmax(0,1fr)}
  .aside{grid-column:1;position:static;max-height:none;overflow:visible;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:24px;border-top:1px solid var(--line);margin-top:8px}
}
.pn{grid-column:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.pn a{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.pn a:hover{border-color:var(--encre)}
.pn a small{font-size:.78rem;color:var(--ink-3)}
.pn a span{font:600 1rem/1.3 var(--f-display)}
.pn a.next{text-align:right}

}

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('enz-data').textContent);
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function lc(s){ return String(s).toLowerCase(); }
function slugTag(t){ return lc(t).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-'); }

/* ---------- Daten vorbereiten ---------- */
var byId = {}, areaBy = {};
D.entries.forEach(function(e, i){ e.idx = i; byId[e.id] = e; });
D.areas.forEach(function(a){ areaBy[a.code] = a; });
var nb = {}, back = {};
D.entries.forEach(function(e){ nb[e.id] = new Set(); back[e.id] = new Set(); });
var edges = [], seen = {};
D.entries.forEach(function(e){
  e.qv.forEach(function(t){
    if (!byId[t] || t === e.id) return;
    nb[e.id].add(t); nb[t].add(e.id);
    var k = [e.id, t].sort().join('|');
    if (!seen[k]) { seen[k] = 1; edges.push({ s: e.id, t: t, mutual: byId[t].qv.indexOf(e.id) >= 0 }); }
  });
  e.qv.concat(e.inline).forEach(function(t){ if (byId[t] && t !== e.id) back[t].add(e.id); });
});
var mutualCount = edges.filter(function(x){ return x.mutual; }).length;
var tagSlug = {}, allTags = [];
D.overview.tag_groups.forEach(function(g){ g.tags.forEach(function(t){ tagSlug[slugTag(t.tag)] = t.tag; allTags.push(t.tag); }); });
D.entries.forEach(function(e){ e.tags.forEach(function(t){ if (!tagSlug[slugTag(t)]) { tagSlug[slugTag(t)] = t; allTags.push(t); } }); });
var tagDesc = {};
D.overview.tag_groups.forEach(function(g){ g.tags.forEach(function(t){ tagDesc[t.tag] = t.desc; }); });
var tpl = D.overview.template || {};
function rubName(slug){ var r = D.rubricOrder.filter(function(x){ return x.slug === slug; })[0]; return r ? r.name : slug; }
function areaLabel(code){ return code + ' · ' + areaBy[code].name; }
function codeChip(id){ return '<span class="code a-' + lc(id[0]) + '">' + id + '</span>'; }
function statusText(e){ return e.status === 'dr' ? 'Deep Research eingearbeitet' : 'Entwurf, Deep Research ausstehend'; }
var SRC = D.source || null;
var ONLINE = /^https?:$/.test(location.protocol);
function encPath(p){ return String(p).split('/').map(encodeURIComponent).join('/'); }
function offlineLink(){ return '<a href="' + esc(D.offlineFile) + '" download>Offline-Fassung herunterladen</a>'; }

var view = $('#view');
var state = { tags: new Set(), qAreas: new Set(), qTag: '', cur: null, pendingMarks: null };

/* ---------- Kopf, Fuß ---------- */
var topEl = $('.top');
function setHeaderH(){ var sticky = getComputedStyle(topEl).position === 'sticky'; document.documentElement.style.setProperty('--header-h', (sticky ? topEl.offsetHeight : 0) + 'px'); }
setHeaderH();
if (window.ResizeObserver) new ResizeObserver(setHeaderH).observe(topEl); else window.addEventListener('resize', setHeaderH);
$('#foot').innerHTML =
  '<span>Stand ' + esc(D.stand) + '</span>' +
  '<span>' + D.entries.length + ' Einträge, ' + edges.length + ' Verbindungen</span>' +
  (SRC ? '<span>Quelle und Versionsverlauf: <a href="' + esc(SRC.repoUrl) + '" target="_blank" rel="noopener">' + esc(SRC.name) + ' ↗</a></span>' : '') +
  (ONLINE ? '<span>' + offlineLink() + '</span>' : '');
function setNav(key){ $$('.nav a').forEach(function(a){ if (a.getAttribute('data-nav') === key) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); }

/* ---------- Startseite ---------- */
function viewStart(opts){
  opts = opts || {};
  setNav('start');
  if (opts.tag && tagSlug[opts.tag]) { state.tags = new Set([tagSlug[opts.tag]]); }
  var drCount = D.entries.filter(function(e){ return e.status === 'dr'; }).length;
  var ways = [
    { href: '#netz', k: 'Ansicht', t: 'Netz der Querverweise', d: 'Wie die ' + D.areas.length + ' Bereiche über ' + edges.length + ' Verbindungen zusammenhängen' },
    { href: '#querschnitt-stolpersteine', k: 'Querschnitt', t: 'Stolpersteine', d: (tpl['Stolpersteine'] || {}).nutzen || 'Typische Fehler im Referendariat' },
    { href: '#querschnitt-beobachten', k: 'Querschnitt', t: 'Beobachten und beraten', d: (tpl['Beobachten und beraten'] || {}).nutzen || 'Leitfragen für Nachbesprechungen' },
    { href: '#querschnitt-reflexion', k: 'Querschnitt', t: 'Reflexionsfragen', d: (tpl['Reflexionsfragen'] || {}).nutzen || 'Fragen an Referendare' }

  var h = '';

       '<div class="eyebrow">Stand ' + esc(D.stand) + '</div>' +

       '</div></section>';
  h += '<nav class="ways" aria-label="Einstiege">' + ways.map(function(w){
         return '<a class="way" href="' + w.href + '"><span class="k">' + w.k + '</span><span class="t">' + esc(w.t) + '</span><span class="d">' + esc(w.d) + '</span></a>';
       }).join('') + '</nav>';
  h += '<div class="sys-head"><div><div class="eyebrow">Systematik</div><h2 class="section-title">Alle Einträge nach Bereichen</h2></div>' +

       }).join('') + '<div class="fstate" id="fstate"></div></div>';
  h += '<div class="areas">' + D.areas.map(function(a){
         return '<section class="area a-' + lc(a.code) + '" id="bereich-' + lc(a.code) + '"><div class="area-h"><span class="L">' + a.code + '</span><span class="N">' + esc(a.name) + '</span></div><ul>' +
           a.entries.map(function(id){
             var e = byId[id];
             return '<li><a href="#' + lc(id) + '" data-id="' + id + '" data-ref="' + id + '">' + codeChip(id) + '<span class="tt">' + esc(e.title) + '</span><i class="st' + (e.status === 'dr' ? ' dr' : '') + '" title="' + statusText(e) + '"></i></a></li>';
           }).join('') + '</ul></section>';
       }).join('') + '</div>';
  view.innerHTML = h;
  $('#filters').addEventListener('click', function(ev){
    var b = ev.target.closest('.chip'); if (b) { var t = b.getAttribute('data-tag'); if (state.tags.has(t)) state.tags.delete(t); else state.tags.add(t); applyFilter(); return; }

  if (opts.area) { var el = document.getElementById('bereich-' + opts.area); if (el) el.scrollIntoView({ block: 'start' }); }
  else window.scrollTo(0, 0);
}
function applyFilter(){
  var tags = Array.from(state.tags), n = 0;
  $$('#filters .chip').forEach(function(b){ b.setAttribute('aria-pressed', state.tags.has(b.getAttribute('data-tag')) ? 'true' : 'false'); });

    var e = byId[a.getAttribute('data-id')];
    var ok = tags.every(function(t){ return e.tags.indexOf(t) >= 0; });
    if (ok) n++;
    a.classList.toggle('dim', tags.length > 0 && !ok);
    a.classList.toggle('hit', tags.length > 0 && ok);
  });
  var fs = $('#fstate');
  if (!tags.length) fs.innerHTML = '<span class="muted">Tags anklicken, um passende Einträge hervorzuheben. Mehrere Tags grenzen weiter ein.</span>';
  else fs.innerHTML = '<span><b>' + n + '</b> von ' + D.entries.length + ' Einträgen tragen ' + tags.map(function(t){ return '#' + esc(t); }).join(' und ') + '</span><button type="button" id="fclear">Auswahl aufheben</button>';
}

/* ---------- Eintrag ---------- */
var spy = null;
function viewEntry(id, rub){
  var e = byId[id], a = areaBy[e.area];
  if (state.cur === id && view.querySelector('.entry')) { scrollToRub(rub); applyMarks(); return; }
  state.cur = id;
  setNav('');
  var i = e.idx, prev = D.entries[i - 1], next = D.entries[i + 1];

  var h = '<div class="entry a-' + lc(e.area) + '">';
  h += '<header class="e-head"><div class="eyebrow"><a href="#bereich-' + lc(e.area) + '"><span class="sq"></span>' + esc(areaLabel(e.area)) + '</a></div>' +
       '<h1><span class="ec">' + e.id + '</span><span>' + esc(e.title) + '</span></h1>' +
       '<div class="e-meta"><span class="tags">' + e.tags.map(function(t){
         return '<a class="chip" href="#tag-' + slugTag(t) + '"' + (tagDesc[t] ? ' title="' + esc(tagDesc[t]) + '"' : '') + '>#' + esc(t) + '</a>';
       }).join('') + '</span>' +
       '<span class="stand"><i class="st' + (e.status === 'dr' ? ' dr' : '') + '"></i>' + esc(e.stand || statusText(e)) + '</span>' +
       '<span class="e-links">' + (e.changed ? '<span class="changed">geändert am ' + esc(e.changed) + '</span>' : '') +
       (SRC && e.path ? '<a class="doc" href="' + esc(SRC.editBase + encPath(e.path)) + '" target="_blank" rel="noopener">Auf GitHub bearbeiten ↗</a>' +
         '<a class="doc" href="' + esc(SRC.historyBase + encPath(e.path)) + '" target="_blank" rel="noopener" title="Alle Änderungen an diesem Eintrag">Versionsverlauf ↗</a>' : '') +
       '</span></div></header>';
  h += '<nav class="reg" aria-label="Rubriken">' + e.rubrics.map(function(r){
         return '<a href="#' + lc(e.id) + '-' + r.slug + '" data-rub="' + r.slug + '">' + esc(r.name === 'Best Practice Französisch' ? 'Best Practice' : r.name) + '</a>';
       }).join('') + '<a href="#' + lc(e.id) + '-vernetzung" data-rub="vernetzung">Vernetzung</a></nav>';
  h += '<article class="e-body">' + e.rubrics.map(function(r){
         return '<section class="sec sec-' + r.slug + '" id="' + lc(e.id) + '-' + r.slug + '" data-rub="' + r.slug + '"><h2>' + esc(r.name) + '</h2><div class="body">' + r.html + '</div></section>';
       }).join('') + '</article>';
  h += '<aside class="aside" id="' + lc(e.id) + '-vernetzung" aria-label="Vernetzung">' +
       '<div class="box"><h3>Vernetzung</h3><div class="mini-wrap">' + miniGraph(e) +
       '<div class="mini-key"><span><i></i>Querverweis dieses Eintrags</span><span><i class="d"></i>nur Rückverweis</span></div></div></div>' +
       '<div class="box"><h3>Wird erwähnt in (' + backs.length + ')</h3>' + (backs.length ? '<ul class="linklist">' + backs.map(function(b){
         var how = [];
         if (byId[b].qv.indexOf(id) >= 0) how.push('Querverweise');
         if (byId[b].inline.indexOf(id) >= 0) how.push('im Text');
         return '<li><a href="#' + lc(b) + '" data-ref="' + b + '">' + codeChip(b) + '<span>' + esc(byId[b].title) + '</span><span class="why">' + (how.length > 1 ? 'unter Querverweise und im Text' : how[0] === 'im Text' ? 'im Text' : 'unter Querverweise') + '</span></a></li>';
       }).join('') + '</ul>' : '<p class="muted">Noch kein anderer Eintrag verweist hierher.</p>') + '</div>' +
       '<div class="box"><h3>Im Bereich ' + e.area + '</h3><ul class="linklist">' + a.entries.map(function(s){
         return '<li><a href="#' + lc(s) + '"' + (s === id ? ' class="cur" aria-current="page"' : '') + '>' + codeChip(s) + '<span>' + esc(byId[s].title) + '</span></a></li>';

function terms(q){ return fold(q).split(/\s+/).filter(function(t){ return t.length >= 2; }); }

var resEl = $('#results'), qEl = $('#q'), sel = -1, hits = [];

function moveSel(d){ if (!hits.length) return; sel = (sel + d + hits.length) % hits.length; $$('.res', resEl).forEach(function(a){ a.setAttribute('aria-selected', String(+a.getAttribute('data-k') === sel)); }); var a = $('#res' + sel); if (a) a.scrollIntoView({ block: 'nearest' }); }
